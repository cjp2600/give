[package]
name = "give"
version = "0.1.0"
edition = "2024"
description = "A native GPUI desktop version of giv"
license = "MIT"

[dependencies]
anyhow = "1"
alacritty_terminal = "=0.25.1"
portable-pty = "=0.9.0"
serde_json = "1"
tempfile = "3"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = "=0.5.1"
# Same versions as GPUI, for decoding image previews off the main thread.
image = { version = "0.25", default-features = false }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
wait-timeout = "0.2"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
cc = "1"

[profile.dev]
debug = 1
opt-level = 1

# GPUI layout, text shaping and syntect are far too slow unoptimized; `make run`
# still rebuilds this crate quickly.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true

